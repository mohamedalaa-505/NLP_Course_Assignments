[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sanad"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]   # levels 4-5: logistic router, neural keyboard, SGNS

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
